# Development only. The seller runs start.bat / start.sh, not Docker.
# Inside the container the API listens on 0.0.0.0 so the port can be published,
# but both ports are published on the host's 127.0.0.1 only: still no LAN exposure.
services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    environment:
      QUOTEDESK_DATA_DIR: /app/data
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: >
      sh -c "pip install -q -r requirements-dev.txt &&
             python -c 'from app.migrate import upgrade_and_seed; upgrade_and_seed()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8765 --reload"
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    ports:
      - "127.0.0.1:8765:8765"

  web:
    image: node:22-slim
    working_dir: /app/frontend
    environment:
      QUOTEDESK_API: http://api:8765
      VITE_HOST: 0.0.0.0
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - web-node-modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pip-cache:
  web-node-modules:
